<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample Request Studio | Interactive Demo</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#19314c;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102b48;color:white;padding:22px max(24px,calc((100vw - 1140px)/2))}header h1{margin:4px 0;font-size:26px}header p{margin:0;color:#b9cee2}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:19px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ccd8e4;border-radius:9px;padding:10px 15px;background:white;color:#19314c}button:hover{filter:brightness(.96)}button.primary{background:#1476ad;border-color:#1476ad;color:white}nav button{background:#244661;color:white;border-color:#42607a}nav button.active{background:white;color:#102b48}main{max-width:1140px;margin:30px auto;padding:0 22px}.card{background:white;border:1px solid #dce5ee;border-radius:14px;padding:23px;margin-bottom:18px;box-shadow:0 4px 15px #17314d0a}.muted{color:#617489}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:29px;font-weight:750}.badge{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;background:#e8f1fc;color:#175c91}.badge.Complete,.badge.Shipped{background:#ddf5e7;color:#17643e}.badge.Hold{background:#fff0d5;color:#855400}.badge.Cancelled{background:#fce3e3;color:#a12d2d}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #e5ecf2;padding:12px 8px;font-size:14px}th{color:#60738a;font-size:12px;text-transform:uppercase}input,select,textarea{padding:11px;border:1px solid #cbd8e5;border-radius:8px;width:100%;background:white}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.note{padding:14px;background:#eef6fc;border-left:4px solid #1476ad;border-radius:6px;margin:15px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.feed{border-left:3px solid #c9d9e8;padding:8px 16px;margin:14px 0}.feed strong{display:block}.empty{text-align:center;padding:25px;color:#617489}.hidden{display:none}@media(max-width:760px){.grid,.fields{grid-template-columns:1fr}table{display:block;overflow-x:auto}}

.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:13px;overflow-x:auto;padding:4px 0 14px}.lane{background:#edf2f8;border:1px solid #d7e1eb;border-radius:12px;padding:12px;min-height:245px}.lane-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:13px}.lane-count{border-radius:20px;background:white;padding:3px 9px;font-size:12px}.ticket{background:white;border:1px solid #dce5ee;border-radius:10px;padding:13px;margin:0 0 10px;box-shadow:0 2px 8px #102b480a}.ticket h4{margin:6px 0;font-size:15px}.ticket p{margin:6px 0;font-size:12px;color:#617489}.ticket button{font-size:12px;padding:6px 10px;margin-top:8px}.workorder{border:1px solid #cbd8e5;border-radius:12px;padding:20px;margin:14px 0;background:#fff}.workorder-top{display:flex;justify-content:space-between;gap:15px;border-bottom:2px solid #19314c;padding-bottom:12px}.workorder-top h3{margin:0}.workorder-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.workorder-meta small{display:block;color:#617489;text-transform:uppercase;font-size:11px;font-weight:700;margin-bottom:4px}.workorder table{margin-top:12px}.workorder-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:900px){.board{grid-template-columns:repeat(4,240px)}.workorder-meta{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><div style="font-size:12px;letter-spacing:2px;color:#8cc6ea">INTERACTIVE BUSINESS WORKFLOW DEMO</div><h1>Sample Request Studio</h1><p>From untracked emails to visible, coordinated requests</p><nav id="nav"></nav></header><main id="app"></main><script>
const KEY='sample_request_studio_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!Array.isArray(data))data=[{id:1001,po:'SHOW-2601',requester:'Sales Team',shipTo:'Trade Show Booth',due:'2026-12-02',items:[{sku:'SMP-201',qty:2,notes:'Display sample'}],status:'In Production',so:'SO-10841',notes:'Rush for upcoming event',history:[{at:'Sample data',text:'Request reviewed and released to production'},{at:'Sample data',text:'Order entry assigned sales order SO-10841'}]},{id:1002,po:'SHOW-2602',requester:'Merchandising',shipTo:'Regional Showroom',due:'2026-12-10',items:[{sku:'SMP-315',qty:3,notes:'Assorted finishes'}],status:'New',so:'',notes:'',history:[{at:'Sample data',text:'Request submitted'}]}];let page='Dashboard',selected=data[0]?.id,cart=[];const statuses=['New','Reviewed','Open','In Production','Ready for QC','Shipped','Complete','Order on Hold','Change Requested','Change Approved','Cancelled'];const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(data))}function current(){return data.find(x=>x.id===selected)||data[0]}function log(r,msg){r.history.unshift({at:new Date().toLocaleString(),text:msg})}function setPage(p){page=p;render()}function openWorkOrder(id){selected=id;setPage('Production');requestAnimationFrame(()=>{const el=document.getElementById('workorder-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.style.outline='3px solid #1476ad';setTimeout(()=>el.style.outline='',1800)}})}function badge(s){return `<span class="badge ${s==='Order on Hold'?'Hold':safe(s)}">${safe(s)}</span>`}function nav(){let n=['Dashboard','Intake','Review','Production','Quick View'];document.getElementById('nav').innerHTML=n.map(x=>`<button class="${page===x?'active':''}" onclick="setPage('${x}')">${x}</button>`).join('')}function heading(t,d){return `<h2 style="margin-top:0">${t}</h2><p class="muted">${d}</p>`}function list(arr){return `<div style="overflow:auto"><table><thead><tr><th>Request</th><th>Reference</th><th>Requested by</th><th>Due</th><th>Items</th><th>Status</th><th></th></tr></thead><tbody>${arr.map(r=>`<tr><td><b>#${r.id}</b></td><td>${safe(r.po)}</td><td>${safe(r.requester)}</td><td>${safe(r.due)}</td><td>${r.items.length}</td><td>${badge(r.status)}</td><td><button onclick="selected=${r.id};setPage('Detail')">View →</button></td></tr>`).join('')}</tbody></table></div>`}function render(){nav();let a=document.getElementById('app');if(page==='Dashboard'){a.innerHTML=`<div class="grid">${[['Total requests',data.length],['Awaiting review',data.filter(x=>x.status==='New').length],['In progress',data.filter(x=>!['Complete','Cancelled','Shipped'].includes(x.status)).length]].map(([l,v])=>`<div class="card"><div class="muted">${l}</div><div class="stat">${v}</div></div>`).join('')}</div><div class="card">${heading('Request Dashboard','A shared view of requests, owners, due dates, and progress.')}<div class="actions"><button class="primary" onclick="setPage('Intake')">+ New request</button></div>${list(data)}</div>`}else if(page==='Intake'){a.innerHTML=`<div class="card">${heading('Submit a sample request','Capture a request once, then track it across departments.')}<div class="fields"><div><label>PO / Reference *</label><input id="po" placeholder="SHOW-2603"></div><div><label>Requested by *</label><input id="requester" placeholder="Sales / department"></div><div><label>Ship to *</label><select id="shipTo"><option value="">Select destination</option><option value="Department">Department</option><option value="Showroom 1">Showroom 1</option></select></div><div><label>Requested ship date *</label><input id="due" type="date"></div></div><label>Request notes</label><textarea id="notes" rows="2" placeholder="Special instructions"></textarea><h3>Requested items</h3><div class="fields"><div><label>Item number *</label><input id="sku" placeholder="SMP-400"></div><div><label>Quantity *</label><input id="qty" type="number" min="1" value="1"></div></div><label>Item notes</label><input id="itemnotes" placeholder="Finish, size, or production instructions"><div class="actions"><button onclick="addItem()">+ Add item</button></div><div id="cart">${cartView()}</div><div class="actions"><button class="primary" onclick="submitRequest()">Submit request</button></div><div class="note">Demo data is saved in this browser only. No real orders or Teams messages are sent.</div></div>`}else if(page==='Review'){let q=data.filter(r=>['New','Reviewed','Change Requested','Change Approved'].includes(r.status));a.innerHTML=`<div class="card">${heading('Order Review','Verify request details before releasing work to order entry and production.')} ${q.length?list(q):'<div class="empty">No requests awaiting review.</div>'}<div class="note">In a real system, review and production actions would be restricted by role. This demo allows you to explore each stage.</div></div>`}else if(page==='Production'){let q=data.filter(r=>!['New','Cancelled','Complete'].includes(r.status));a.innerHTML=`<div class="card">${heading('Production Work Orders','A production-friendly view of what needs to be made, where it goes, and when it is needed.')}<div class="note">These are simplified work orders for the portfolio demo. Select <b>Open request</b> to update progress, place a hold, or record a shipment.</div>${q.length?q.map(r=>`<section class="workorder" id="workorder-${r.id}"><div class="workorder-top"><div><small class="muted">WORK ORDER · REQUEST #${r.id}</small><h3>${safe(r.po)}</h3></div>${badge(r.status)}</div><div class="workorder-meta"><div><small>Ship to</small><strong>${safe(r.shipTo)}</strong></div><div><small>Required ship date</small><strong>${safe(r.due)}</strong></div><div><small>Sales order</small><strong>${safe(r.so||'Not assigned')}</strong></div><div><small>Requested by</small><strong>${safe(r.requester)}</strong></div><div><small>Line items</small><strong>${r.items.length}</strong></div><div><small>Total units</small><strong>${r.items.reduce((n,i)=>n+Number(i.qty||0),0)}</strong></div></div><table><thead><tr><th>Item / SKU</th><th>Quantity</th><th>Production instructions</th></tr></thead><tbody>${r.items.map(i=>`<tr><td><strong>${safe(i.sku)}</strong></td><td>${safe(i.qty)}</td><td>${safe(i.notes||'Standard')}</td></tr>`).join('')}</tbody></table>${r.notes?`<p><strong>Request notes:</strong> ${safe(r.notes)}</p>`:''}<div class="workorder-actions"><button class="primary" onclick="selected=${r.id};setPage('Detail')">Open request / update status →</button></div></section>`).join(''):'<div class="empty">No work orders released to production yet.</div>'}</div>`}else if(page==='Quick View'){const lanes=[{title:'New & Review',match:['New','Reviewed','Change Requested','Change Approved']},{title:'Ready / Open',match:['Open']},{title:'Production & QC',match:['In Production','Ready for QC','Order on Hold']},{title:'Shipped / Closed',match:['Shipped','Complete','Cancelled']}];a.innerHTML=`<div class="card">${heading('Quick View · Project Board','Requests are grouped by current stage so anyone can see where work stands at a glance.')}<div class="note">This board is a project-tracking view of the same requests shown on the Dashboard. It is a proposed replacement for the original dashboard, not a separate set of orders.</div><div class="board">${lanes.map(l=>{let cards=data.filter(r=>l.match.includes(r.status));return `<section class="lane"><div class="lane-head"><span>${l.title}</span><span class="lane-count">${cards.length}</span></div>${cards.length?cards.map(r=>`<article class="ticket"><small class="muted">REQUEST #${r.id}</small><h4>${safe(r.po)}</h4>${badge(r.status)}<p><b>Due:</b> ${safe(r.due)}</p><p><b>Destination:</b> ${safe(r.shipTo)}</p><p>${r.items.length} item${r.items.length===1?'':'s'} · ${r.items.reduce((n,i)=>n+Number(i.qty||0),0)} units</p><button onclick="${l.title==='Production & QC'?`openWorkOrder(${r.id})`:`selected=${r.id};setPage('Detail')`}">${l.title==='Production & QC'?'View work order →':'View request →'}</button></article>`).join(''):'<p class="muted">No requests</p>'}</section>`}).join('')}</div></div>`}else if(page==='Detail'){let r=current();if(!r){setPage('Dashboard');return}a.innerHTML=`<div class="card"><div class="row"><div>${heading('Request #'+r.id,`${safe(r.po)} · ${safe(r.requester)}`)}</div>${badge(r.status)}</div><div class="fields"><p><b>Ship to</b><br>${safe(r.shipTo)}</p><p><b>Requested ship date</b><br>${safe(r.due)}</p><p><b>Sales order</b><br>${safe(r.so||'Not assigned')}</p><p><b>Notes</b><br>${safe(r.notes||'None')}</p></div><h3>Requested items</h3><table><tr><th>Item</th><th>Qty</th><th>Instructions</th></tr>${r.items.map(i=>`<tr><td>${safe(i.sku)}</td><td>${i.qty}</td><td>${safe(i.notes)}</td></tr>`).join('')}</table><h3>Move request forward</h3><div class="fields"><div><label>Workflow status</label><select id="status">${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Sales order number (optional)</label><input id="so" value="${safe(r.so)}" placeholder="SO-00000"></div></div><label>Status note / reason for hold or change</label><input id="statusNote" placeholder="What changed and why?"><div class="actions"><button class="primary" onclick="updateRequest()">Save status & notify team</button><button onclick="setPage('Dashboard')">Back to dashboard</button></div><div class="note">Simulated Teams activity: saving a status adds a visible notification to the timeline. No external messages are sent.</div><h3>Activity & Teams-style updates</h3>${r.history.map(h=>`<div class="feed"><small class="muted">${safe(h.at)}</small><strong>${safe(h.text)}</strong></div>`).join('')}</div>`}}
function cartView(){return cart.length?`<table><tr><th>Item</th><th>Qty</th><th>Notes</th><th></th></tr>${cart.map((x,i)=>`<tr><td>${safe(x.sku)}</td><td>${x.qty}</td><td>${safe(x.notes)}</td><td><button onclick="cart.splice(${i},1);document.getElementById('cart').innerHTML=cartView()">Remove</button></td></tr>`).join('')}</table>`:'<p class="muted">No items added yet.</p>'}function addItem(){let sku=document.getElementById('sku').value.trim(),qty=Number(document.getElementById('qty').value),notes=document.getElementById('itemnotes').value.trim();if(!sku||!Number.isInteger(qty)||qty<1){alert('Enter an item number and a valid quantity.');return}cart.push({sku,qty,notes});document.getElementById('cart').innerHTML=cartView();document.getElementById('sku').value='';document.getElementById('itemnotes').value=''}function submitRequest(){let po=document.getElementById('po').value.trim(),requester=document.getElementById('requester').value.trim(),shipTo=document.getElementById('shipTo').value.trim(),due=document.getElementById('due').value,notes=document.getElementById('notes').value.trim();if(!po||!requester||!shipTo||!due||!cart.length){alert('Complete the required fields and add at least one item.');return}let id=Math.max(1000,...data.map(x=>x.id))+1;data.unshift({id,po,requester,shipTo,due,notes,items:cart.slice(),status:'New',so:'',history:[{at:new Date().toLocaleString(),text:'Request submitted. Review team notified (simulation).'}]});cart=[];save();selected=id;setPage('Detail')}function updateRequest(){let r=current(),status=document.getElementById('status').value,so=document.getElementById('so').value.trim(),note=document.getElementById('statusNote').value.trim();if(status===r.status&&so===r.so&&!note){alert('No changes to save.');return}let old=r.status;r.status=status;r.so=so;log(r,`Status: ${old} → ${status}${note?' · '+note:''}. Teams notification simulated.`);save();render()}render();
</script></body></html>
